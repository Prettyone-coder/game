{

<script>'use strict';

function initialState(){return {version:1,createdAt:Date.now(),completed:[],routesDone:[],cards:{},activity:{},favorites:[],settings:{dailyGoal:15,speed:.9},diagnostic:null,story:{trust:0,supplies:3,intel:0},choices:{},session:null}};

let state=loadState();let page='home',wordFilter='all',wordSearch='',wordLimit=60,modalWordId=null,toastHandle=null;

function say(text){if(!('speechSynthesis'in window)){toast('Этот браузер не поддерживает озвучку.');return}try{window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);const voices=window.speechSynthesis.getVoices();const english=voices.filter(v=>/^en[-_]/i.test(v.lang));const best=english.find(v=>/natural|premium|enhanced/i.test(v.name))||english.find(v=>/^en-US/i.test(v.lang))||english[0];if(best)utterance.voice=best;utterance.lang=best?.lang||'en-US';utterance.rate=Number(state.settings.speed)||.9;utterance.pitch=1;window.speechSynthesis.speak(utterance)}catch(e){toast('Не удалось воспроизвести речь.')}}
const highlight=(text,word)=>{const escaped=escapeHtml(text);return escaped.replace(new RegExp(`\\b(${word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})\\b`,'gi'),'<strong>$1</strong>')};
const cloze=(w)=>w.route?"Подсказки нет. Вспомни английское слово по переводу.":escapeHtml(w.reviewExample||w.example).replace(new RegExp(`\\b${w.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`,'gi'),'________');
const norm=(t)=>String(t||'').trim().toLowerCase().replace(/^["'“”]+|["'“”]+$/g,'').replace(/[.!?]+$/g,'').replace(/\s+/g,' ');
function distractors(w){const options=[w.ru],seen=new Set(options);for(const o of randomize(WORDS)){if(o.id===w.id||seen.has(o.ru))continue;seen.add(o.ru);options.push(o.ru);if(options.length===4)break}return randomize(options)}
function getCurrent(){const s=state.session;if(!s)return null;return wordById[s.kind==='diagnostic'?s.queue[s.idx]:s.queue?.[s.idx]?.id]}
function updateChrome(){const due=dueCards().length;const navs=[['home','Обзор'],['chapters','Главы'],['route','1000 слов'],['review','Повторение'],['words','Словарь'],['stats','Прогресс'],['settings','Настройки']];const aside=$('#nav-desktop');if(aside)aside.innerHTML=navs.map(([id,label])=>`<button type="button" class="nav-btn ${page===id?'active':''}" data-action="nav" data-page="${id}"><span class="nav-icon">${icons[id]}</span>${label}${id==='review'&&due?`<span class="nav-count">${due}</span>`:''}</button>`).join('');const mobile=$('#nav-mobile');if(mobile)mobile.innerHTML=navs.filter(([id])=>id!=='settings'&&id!=='chapters').map(([id,label])=>`<button type="button" class="${page===id?'active':''}" data-action="nav" data-page="${id}"><span class="nav-icon">${icons[id]}</span><span>${label}</span></button>`).join('');const crumb=$('#breadcrumbs');if(crumb)crumb.textContent={home:'ЦЕНТР УПРАВЛЕНИЯ',chapters:'ИСТОРИЯ / МИССИИ',route:'СЛОВАРНЫЙ МАРШРУТ', 'route-session':'ТРЕНИРОВКА СЛОВ',review:'ПАМЯТЬ / ПОВТОРЕНИЕ',words:'ЛЕКСИКОН',stats:'АНАЛИТИКА',settings:'НАСТРОЙКИ',lesson:'АКТИВНАЯ МИССИЯ',diagnostic:'СТАРТОВАЯ ПРОВЕРКА'}[page]||'ECHO';$('#side-progress').style.width=`${percent(knownCards(),WORDS.length)}%`;$('#side-count').textContent=`${knownCards()} / ${WORDS.length}`;$('#header-due').textContent=due;$('#header-streak').textContent=streak();}
function streak(){let n=0;for(let i=0;i<365;i++){const a=state.activity[todayKey(-i)];if((a?.attempts||0)===0){if(i===0)continue;break}n++;}return n}

<div class="section-heading"><div><h2>Следующие главы</h2><p>История на английском, словарь и решения с последствиями.</p></div><button class="btn btn-quiet btn-sm" data-action="nav" data-page="chapters">Все 12 глав →</button></div>
<div class="chapter-grid">${CHAPTERS.filter(c=>!state.completed.includes(c.id)).slice(0,3).concat(CHAPTERS.filter(c=>state.completed.includes(c.id)).slice(-Math.max(0,3-CHAPTERS.filter(c=>!state.completed.includes(c.id)).length))).slice(0,3).map(chapterCard).join('')}</div>
<p class="source-note">* «Уверенно удерживаются» — внутренний показатель тренажёра, не доказательство владения словом в свободной речи. Данные хранятся только в этом браузере. В базе 1000 слов; 120 сюжетных имеют контекстные примеры, 880 дополнительных — только основные значения, аудио и тесты. Это авторская подборка, не официальная копия Oxford 3000.</p>`}
function chapterCard(c){const learned=c.words.filter(w=>state.cards[w.id]).length,complete=state.completed.includes(c.id);return `<article class="chapter-card"><div class="chapter-meta"><span>${c.code}</span><span>${c.level}</span></div><h3>${escapeHtml(c.title)}</h3><p>${escapeHtml(c.hook)}</p><div class="chapter-foot"><span class="chip ${complete?'good':''}">${complete?'✓ ПРОЙДЕНА':`${learned}/10 СЛОВ`}</span><button class="btn btn-secondary btn-sm" data-action="start-chapter" data-id="${c.id}">${complete?'Ещё раз':'Играть'} →</button></div>${complete?`<div class="chapter-progress"><span style="width:100%"></span></div>`:''}</article>`}
function renderChapters(){return `<div class="eyebrow">THE LAST SIGNAL / 12 МИССИЙ</div><h1 class="headline">История, которую<br>нужно понять.</h1><p class="lead">В каждой главе 10 новых слов: сначала изучаешь их в сценах, потом вспоминаешь, набираешь и распознаёшь на слух. Сюжетные решения меняют финал.</p><div class="chapter-grid">${CHAPTERS.map(chapterCard).join('')}</div><div class="notice mt30"><strong>Хочешь больше слов?</strong> <button class="btn btn-secondary btn-sm" data-action="nav" data-page="route">Открыть маршрут из 880 дополнительных слов →</button></div><div class="notice mt20">Все главы доступны сразу. Но для лучшего запоминания начинай с повторения уже изученного и не гонись за количеством новых слов.</div>`}
function startChapter(id){const c=CHAPTERS.find(x=>x.id===Number(id));if(!c)return;state.session={kind:'lesson',chapterId:c.id,phase:'intro',idx:0,queue:[],results:{},choice:null,feedback:null,options:null,hint:false};save();setPage('lesson')}
function makeLessonQueue(c){const choice=randomize(c.words.map(w=>({id:w.id,mode:'choice'})));const type=randomize(c.words.map(w=>({id:w.id,mode:'type'})));const listen=randomize(c.words).slice(0,5).map(w=>({id:w.id,mode:'listen'}));return [...choice,...type,...listen]}
function startStudy(){const s=state.session;s.phase='study';s.idx=0;save();render()}

function renderLesson(){const s=state.session;if(!s||s.kind!=='lesson')return `<div class="empty"><h3>Сейчас нет активной главы.</h3><button class="btn btn-primary" data-action="nav" data-page="chapters">Выбрать главу</button></div>`;const c=CHAPTERS[s.chapterId-1];if(s.phase==='intro')return `<div class="lesson-frame"><div class="eyebrow">${c.code} / ${escapeHtml(c.place)}</div><h1 class="headline">${escapeHtml(c.title)}</h1><p class="lead">${escapeHtml(c.hook)}</p><div class="scene"><div><div class="smallcaps">ВХОДЯЩИЙ СИГНАЛ / ENGLISH</div><div class="scene-title mt14">${escapeHtml(c.english)}</div></div><div class="scene-en">Короткий сюжет. Реальная работа с памятью.</div></div><div class="stats-triplet mt20"><div><strong>10</strong><span>новых слов</span></div><div><strong>25</strong><span>проверок</span></div><div><strong>1</strong><span>сюжетный выбор</span></div></div><div class="button-row mt20"><button class="btn btn-primary" data-action="begin-study">Начать изучение →</button><button class="btn btn-quiet" data-action="nav" data-page="chapters">Вернуться к главам</button></div></div>`;
if(s.phase==='study'){const w=c.words[s.idx];return `<div class="lesson-frame"><div class="lesson-topline"><span class="smallcaps">01 / ЗНАКОМСТВО</span><div class="lesson-steps">${c.words.map((_,i)=>`<i class="${i<=s.idx?'done':''}"></i>`).join('')}</div><span class="small muted num">${s.idx+1} / 10</span></div><div class="lesson-content"><span class="chip">${c.level} · ${escapeHtml(c.place)}</span><div class="word-title">${escapeHtml(w.en)}</div><p class="prompt-title" style="color:var(--accent)">${escapeHtml(w.ru)}</p><button class="audio-button" data-action="speak" data-text="${attr(w.example)}"><span class="audio-wave"><i></i><i></i><i></i><i></i><i></i></span> ${w.route?'Слушать слово':'Слушать пример'}</button><div class="line"></div><p class="example">${highlight(w.example,w.en)}</p><p class="translation">${escapeHtml(w.translation)}</p><div class="notice mt20">Произнеси слово вслух и попробуй объяснить его значение без чтения перевода. Через несколько карточек начнётся проверка памяти.</div></div><div class="button-row mt20"><button class="btn btn-primary" data-action="next-study">${s.idx===9?'Перейти к проверке':'Следующее слово'} →</button><span class="muted small">Пока это только знакомство, не запоминание.</span></div></div>`}
if(s.phase==='quiz')return renderLessonQuiz(s,c);
if(s.phase==='decision')return renderDecision(s,c);
if(s.phase==='complete')return renderLessonComplete(s,c);
return ''}
function renderLessonQuiz(s,c){const q=s.queue[s.idx],w=wordById[q.id],p=Math.round(s.idx/s.queue.length*100),feedback=s.feedback,correct=feedback?.correct;let content='';const info=q.mode==='choice'?'ВЫБЕРИ ЗНАЧЕНИЕ':q.mode==='type'?'ВСПОМНИ И НАПИШИ':'ПОНИМАНИЕ НА СЛУХ';if(q.mode==='choice')content=`<div class="smallcaps">Что означает выделенное слово?</div><p class="example">${highlight(w.example,w.en)}</p><p class="translation">${feedback?escapeHtml(w.translation):'Прочитай фразу и выбери значение слова.'}</p>${renderChoices(s.options||distractors(w),feedback,w.ru,'quiz-choice')}`;
if(q.mode==='type')content=`<div class="smallcaps">Переведи на английский. Без вариантов ответа.</div><h2 style="color:var(--accent)">${escapeHtml(w.ru)}</h2><p class="translation">Контекст: ${cloze(w)}</p>${!feedback?`<form id="quiz-form" class="mt20"><input class="answer-field" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" name="answer" placeholder="Напиши английское слово…" aria-label="Английское слово" required><div class="button-row mt14"><button class="btn btn-primary" type="submit">Проверить ответ →</button></div></form>`:`<div class="notice mt14">Твой ответ: <strong>${escapeHtml(feedback.answer||'—')}</strong></div>`}`;
if(q.mode==='listen')content=`<div class="smallcaps">Послушай предложение. Текст скрыт.</div><p class="lead">Какое значение у ключевого слова в предложении?</p><div class="button-row"><button class="audio-button" data-action="speak" data-text="${attr(w.example)}"><span class="audio-wave"><i></i><i></i><i></i><i></i><i></i></span> Воспроизвести</button>${!feedback?`<button class="btn btn-quiet" data-action="listen-hint">${s.hint?'Текст показан':'Не расслышал? Показать текст'}</button>`:''}</div>${s.hint||feedback?`<p class="example">${highlight(w.example,w.en)}</p>`:'<div style="height:30px"></div>'}${renderChoices(s.options||distractors(w),feedback,w.ru,'quiz-choice')}`;
return `<div class="lesson-frame"><div class="lesson-head"><div class="label-row"><span class="smallcaps">02 / ${info}</span><span class="muted small num">${s.idx+1} / ${s.queue.length}</span></div><div class="progress-line"><span style="width:${p}%"></span></div><div class="meter-row"><span>ГЛАВА ${c.id} / ${c.title}</span><span>ПРОВЕРКА ПАМЯТИ</span></div></div><div class="lesson-content"><div class="label-row"><span class="chip">${q.mode==='choice'?'Смысл':q.mode==='type'?'Самостоятельный ответ':'Аудирование'}</span><span class="muted small">${q.mode==='type'?'Без подсказок':q.mode==='listen'?'Озвучка браузера':'Чтение в контексте'}</span></div>${content}${feedback?`<div class="feedback ${correct?'':'bad'}"><h3>${correct?'✓ Верно!':'↻ Пока не вспомнил'}</h3><p>${correct?'Хорошо. Но закрепление подтвердится только на следующих повторениях.':`Правильный ответ: <strong>${escapeHtml(w.en)}</strong> — ${escapeHtml(w.ru)}.`}${feedback.hint?' Подсказка использована: зачёт снижен.':''}</p></div><div class="button-row mt20"><button class="btn btn-primary" data-action="next-quiz">${s.idx===s.queue.length-1?'К развязке':'Дальше'} →</button><button class="btn btn-quiet btn-sm" data-action="speak" data-text="${attr(w.example)}">Слушать ещё раз ◖))</button></div>`:''}</div><div class="bar-note">Ошибки сохраняются в тренировке и влияют на ближайшее повторение. Угадывание не заменяет самостоятельного воспроизведения.</div></div>`}
function renderChoices(opts,feedback,correct,action){return `<div class="choices">${opts.map((o,i)=>`<button type="button" class="choice ${feedback?(o===correct?'correct':o===feedback.answer?'incorrect':''):''}" data-action="${action}" data-value="${attr(o)}" ${feedback?'disabled':''}><span class="choice-key">${i+1}</span><span>${escapeHtml(o)}</span></button>`).join('')}</div>`}
function answerLesson(answer){const s=state.session;if(!s||s.kind!=='lesson'||s.phase!=='quiz'||s.feedback)return;const q=s.queue[s.idx],w=wordById[q.id];const correct=q.mode==='type'?norm(answer)===norm(w.en):answer===w.ru;const credited=correct&&!s.hint;s.feedback={correct:credited,answer:String(answer),hint:!!s.hint};const r=s.results[w.id]||(s.results[w.id]={correct:0,failed:0,typeCorrect:false});if(credited)r.correct++;else r.failed++;if(q.mode==='type'&&credited)r.typeCorrect=true;activity(credited,'lesson');save();render()}
function advanceQuiz(){const s=state.session;if(!s.feedback)return;s.idx++;s.feedback=null;s.hint=false;if(s.idx>=s.queue.length){s.phase='decision'}else{s.options=s.queue[s.idx].mode==='type'?null:distractors(wordById[s.queue[s.idx].id])}save();render()}
function renderDecision(s,c){const results=Object.values(s.results),correct=results.reduce((a,r)=>a+r.correct,0),total=s.queue.length;return `<div class="lesson-frame"><div class="eyebrow">03 / РАЗВЯЗКА</div><h1 class="headline">Теперь решение за тобой.</h1><p class="lead">${escapeHtml(c.decision)} Здесь важнее понять последствия, чем заработать очки.</p><section class="panel"><div class="label-row"><span class="smallcaps">ПРОВЕРКА ЗАВЕРШЕНА</span><span class="chip">${correct} / ${total} правильных</span></div><p class="example" style="margin-top:4px!important">${escapeHtml(c.english)}</p><div class="decision-options">${c.options.map((o,i)=>`<button class="decision-btn" data-action="decision" data-value="${i}"><strong>${escapeHtml(o.en)}</strong><span>${escapeHtml(o.ru)}</span></button>`).join('')}</div></section><p class="footnote">Решение влияет на показатели сюжета и эпилог. Оно не влияет на честную оценку английского.</p></div>`}
function chooseDecision(i){const s=state.session,c=CHAPTERS[s.chapterId-1];s.choice=Number(i);s.phase='complete';save();render()}
function renderLessonComplete(s,c){const decision=c.options[s.choice||0],r=Object.values(s.results),correct=r.reduce((a,x)=>a+x.correct,0);return `<div class="lesson-frame"><div class="eyebrow">MISSION COMPLETE / ${c.code}</div><h1 class="headline">Глава завершена.<br><span style="color:var(--accent)">Обучение продолжается.</span></h1><p class="lead">${escapeHtml(decision.result)}</p><div class="results-grid"><div class="result-box"><strong>${correct} / 25</strong><span>Удачных ответов в главе</span></div><div class="result-box"><strong>10</strong><span>Слов попадут в систему повторений</span></div></div><div class="notice">Проверенные слова вернутся через 10 минут или завтра — в зависимости от ответов. После нескольких удачных повторений интервал начнёт расти.</div><div class="button-row mt20"><button class="btn btn-primary" data-action="finish-chapter">Сохранить результат →</button></div></div>`}
function finishChapter(){const s=state.session,c=CHAPTERS[s.chapterId-1],now=Date.now();for(const w of c.words){const prev=state.cards[w.id],r=s.results[w.id]||{correct:0,failed:1,typeCorrect:false};if(prev){prev.exposures=(prev.exposures||0)+1;continue}const solid=r.typeCorrect&&r.failed===0;state.cards[w.id]={introducedAt:now,exposures:1,stage:0,interval:solid?1:10/1440,due:now+(solid?DAY:10*60000),reviews:0,failures:r.failed,successes:r.correct,lastReviewed:null}}if(!state.completed.includes(c.id))state.completed.push(c.id);if(!state.choices[c.id]){const op=c.options[s.choice||0];state.choices[c.id]=s.choice||0;for(const [stat,v] of Object.entries(op.effect))state.story[stat]=(state.story[stat]||0)+v}state.session=null;save();const next=CHAPTERS.find(ch=>!state.completed.includes(ch.id));setPage('home');toast(`Глава ${c.id} завершена. ${next?'Продолжение открыто.':'История пройдена!'}`)}
function startDiagnostic(){const picks=[...randomize(CHAPTERS.flatMap(c=>c.words)).slice(0,6),...randomize(EXTRA_WORDS).slice(0,24)];state.session={kind:'diagnostic',queue:randomize(picks.map(w=>w.id)),idx:0,score:0,answers:[],feedback:null,options:null};state.session.options=distractors(wordById[state.session.queue[0]]);save();setPage('diagnostic')}
function answerDiagnostic(answer){const s=state.session;if(!s||s.kind!=='diagnostic'||s.feedback)return;const w=wordById[s.queue[s.idx]],correct=answer===w.ru;if(correct)s.score++;s.feedback={answer,correct};s.answers.push({id:w.id,correct});save();render()}
function nextDiagnostic(){const s=state.session;s.idx++;s.feedback=null;if(s.idx>=s.queue.length){state.diagnostic={date:Date.now(),score:s.score,total:s.queue.length,answers:s.answers};state.session=null;save();setPage('stats');toast('Диагностика завершена. Это ориентир, не официальный тест CEFR.')}else{s.options=distractors(wordById[s.queue[s.idx]]);save();render()}}
function renderDiagnostic(){const s=state.session;if(!s||s.kind!=='diagnostic')return `<div class="empty">Нет активной диагностики. <button class="btn btn-primary" data-action="start-diagnostic">Начать</button></div>`;const w=wordById[s.queue[s.idx]];return `<div class="lesson-frame"><div class="eyebrow">БЫСТРАЯ ДИАГНОСТИКА / 30 СЛОВ</div><h1 class="headline">Что ты уже узнаёшь?</h1><p class="lead">Выбирай значение без словаря. Если не знаешь — нажми «Не знаю». Это проверка узнавания, а не полноценная оценка твоего уровня английского.</p><div class="lesson-topline"><span class="smallcaps">ВОПРОС ${s.idx+1}/${s.queue.length}</span><div class="lesson-steps">${s.queue.map((_,i)=>`<i class="${i<=s.idx?'done':''}"></i>`).join('')}</div></div><div class="lesson-content"><div class="smallcaps">Значение английского слова</div><div class="word-title">${escapeHtml(w.en)}</div><div class="button-row"><button class="btn btn-quiet btn-sm" data-action="speak" data-text="${attr(w.example)}">◖)) Произношение</button></div>${renderChoices(s.options||distractors(w),s.feedback,w.ru,'diag-choice')}${s.feedback?`<div class="feedback ${s.feedback.correct?'':'bad'}"><h3>${s.feedback.correct?'Правильно':'Правильный ответ'}</h3><p>${escapeHtml(w.en)} — <strong>${escapeHtml(w.ru)}</strong></p></div><button class="btn btn-primary mt20" data-action="next-diag">${s.idx===s.queue.length-1?'Узнать результат':'Следующий вопрос'} →</button>`:`<button class="btn btn-quiet mt14" data-action="diag-unknown">Не знаю это слово</button>`}</div></div>`}
function startReview(sprint=false){let entries;if(sprint){entries=randomize(Object.entries(state.cards).filter(([id])=>wordById[id])).slice(0,10)}else{entries=dueCards().slice(0,35)}if(!entries.length){toast(sprint?'Сначала изучи одну главу.':'Сейчас нет слов для повторения.');setPage(sprint?'chapters':'review');return}state.session={kind:sprint?'sprint':'review',queue:entries.map(([id])=>id),idx:0,feedback:null,hint:false,correct:null,mode:sprint?'sprint':'review'};save();setPage('review')}
function answerReview(answer){const s=state.session;if(!s||!['review','sprint'].includes(s.kind)||s.feedback)return;const w=wordById[s.queue[s.idx]],literalCorrect=norm(answer)===norm(w.en);s.feedback={answer,correct:literalCorrect&&!s.hint,literalCorrect,hinted:!!s.hint};save();render()}
function gradeReview(grade){const s=state.session;if(!s||!s.feedback)return;const id=s.queue[s.idx],c=state.cards[id],ok=s.feedback.correct;let g=Number(grade);if(!ok)g=0;activity(ok&&g>0,'review');if(s.kind==='review'&&c){c.reviews++;c.lastReviewed=Date.now();if(g===0){c.failures++;c.stage=0;c.interval=10/1440;c.due=Date.now()+10*60000}else if(g===1){c.stage=Math.max(1,c.stage);c.interval=Math.max(.5,(c.interval||0)*1.35);c.due=Date.now()+c.interval*DAY;c.successes++}else if(g===2){c.stage++;c.interval=Math.max(1,(c.interval||0)*2.1);c.due=Date.now()+c.interval*DAY;c.successes++}else if(g===3){c.stage+=2;c.interval=Math.max(3,(c.interval||0)*3.1);c.due=Date.now()+c.interval*DAY;c.successes++}}
if(s.kind==='sprint'&&c){if(ok)c.successes++;else c.failures++}s.idx++;s.feedback=null;s.hint=false;if(s.idx>=s.queue.length){state.session=null;save();setPage('review');toast('Сессия завершена. Данные сохранены.')}else{save();render()}}
function renderReview(){const s=state.session;if(s&&['review','sprint'].includes(s.kind))return renderActiveReview(s);const due=dueCards().length,next=Object.values(state.cards).filter(c=>c.due>Date.now()).sort((a,b)=>a.due-b.due)[0];return `<div class="eyebrow">SPACED RECALL / ПАМЯТЬ</div><h1 class="headline">Верни слово<br>из памяти.</h1><p class="lead">Здесь нет списка ответов. Ты видишь значение и предложение с пропуском — и пишешь английское слово сам. После проверки интервал повторения изменится.</p><div class="grid-3"><div class="stat-card"><div class="stat-label">Сейчас к повторению</div><div class="stat-value">${due}</div><div class="stat-meta">Наступил срок</div></div><div class="stat-card"><div class="stat-label">Изучается</div><div class="stat-value">${knownCards()}</div><div class="stat-meta">В персональной колоде</div></div><div class="stat-card"><div class="stat-label">Интервал от 7 дней</div><div class="stat-value">${durableCards()}</div><div class="stat-meta">Без гарантии полного владения</div></div></div><div class="section-heading"><div><h2>Следующая сессия</h2><p>Без таймеров, штрафов за паузы и ежедневных обязательств.</p></div></div>${due?`<div class="focus-card"><span class="smallcaps">СИСТЕМА ПОВТОРЕНИЙ</span><h3>${due} слов готовы к проверке</h3><p>Ошибки попадут на раннее повторение, успешные ответы получат более длинный интервал.</p><button class="btn btn-primary mt14" data-action="start-review">Начать повторение →</button></div>`:`<div class="empty"><span class="empty-icon">◎</span><h3>На данный момент всё повторено</h3><p>${next?`Следующее повторение: ${new Date(next.due).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}.`:'Изучи первую главу, чтобы слова появились здесь.'}</p><button class="btn btn-primary mt14" data-action="${knownCards()?'start-sprint':'nav'}" ${knownCards()?'':'data-page="chapters"'}>${knownCards()?'Потренироваться вне расписания':'Перейти к главам'} →</button></div>`}<div class="notice mt20">Алгоритм — упрощённые интервальные повторения: ошибки → примерно через 10 минут, успешные ответы → через дни с увеличением интервала. Он не является FSRS и не обещает точного процента удержания.</div>`}
function renderActiveReview(s){const w=wordById[s.queue[s.idx]],f=s.feedback,p=percent(s.idx,s.queue.length);return `<div class="lesson-frame"><div class="lesson-head"><div class="label-row"><span class="smallcaps">${s.kind==='sprint'?'СВОБОДНАЯ ТРЕНИРОВКА':'ИНТЕРВАЛЬНОЕ ПОВТОРЕНИЕ'}</span><span class="muted small num">${s.idx+1} / ${s.queue.length}</span></div><div class="progress-line"><span style="width:${p}%"></span></div></div><div class="lesson-content"><span class="chip">САМОСТОЯТЕЛЬНОЕ ВСПОМИНАНИЕ</span><div class="smallcaps mt20">Какое слово подходит?</div><h2 class="mt14" style="color:var(--accent)">${escapeHtml(w.ru)}</h2><p class="translation">${cloze(w)}</p>${!f?`<form id="review-form" class="mt20"><input name="answer" class="answer-field" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Введи слово по-английски…" required><div class="button-row mt14"><button type="submit" class="btn btn-primary">Проверить →</button><button type="button" class="btn btn-quiet btn-sm" data-action="speak" data-text="${attr(w.example)}">◖)) Послушать пример</button></div></form>`:`<div class="notice mt14">Твой ответ: <b>${escapeHtml(f.answer)}</b></div><div class="feedback ${f.correct?'':'bad'}"><h3>${f.correct?'✓ Верно':f.literalCorrect&&f.hinted?'↻ Ответ с подсказкой':'↻ Пока неверно'}</h3><p><strong>${escapeHtml(w.en)}</strong> — ${escapeHtml(w.ru)}. ${escapeHtml(w.example)} ${f.hinted?'Озвучка раскрыла ответ, поэтому результат не засчитан.':''}</p></div><div class="smallcaps mt20">Оцени, насколько легко вспомнил</div><div class="button-row mt14">${!f.correct?`<button class="btn btn-danger" data-action="grade" data-value="0">Не вспомнил · 10 мин</button>`:`<button class="btn btn-quiet" data-action="grade" data-value="0">Угадал</button><button class="btn btn-secondary" data-action="grade" data-value="1">С трудом</button><button class="btn btn-primary" data-action="grade" data-value="2">Вспомнил</button><button class="btn btn-secondary" data-action="grade" data-value="3">Легко</button>`}</div>`}</div><p class="footnote">Спринт не меняет расписание повторений. Если послушать пример до ответа, слово не засчитывается как вспомненное самостоятельно.</p></div>`}

function renderLexiconResults(){let list=WORDS.filter(w=>{if(wordFilter==='studied'&&!state.cards[w.id])return false;if(wordFilter==='due'&&!dueCards().some(([id])=>id===w.id))return false;if(wordFilter==='new'&&state.cards[w.id])return false;if(wordFilter==='favorite'&&!state.favorites.includes(w.id))return false;const text=`${w.en} ${w.ru}`.toLowerCase();return text.includes(wordSearch.toLowerCase().trim())});return `<p class="small muted">Найдено: ${list.length} · Показано: ${Math.min(wordLimit,list.length)}</p>${list.length?`<div class="lexicon-grid">${list.slice(0,wordLimit).map(w=>`<article class="lexicon-word"><div class="flex between center gap8"><div style="min-width:0"><div class="row-name">${escapeHtml(w.en)}</div><div class="row-sub">${escapeHtml(w.ru)}</div></div><button class="icon-btn ${state.favorites.includes(w.id)?'is-fav':''}" data-action="favorite" data-id="${w.id}" aria-label="В избранное">${state.favorites.includes(w.id)?'★':'☆'}</button></div><footer><span class="chip ${state.cards[w.id]?'good':''}">${state.cards[w.id]?state.cards[w.id].stage>=3?'Повторяется':'Изучаю':w.route?`Маршрут ${Math.ceil(Number(w.id.slice(1))/10)}`:`Глава ${w.chapter}`}</span><div class="button-row"><button class="icon-btn" title="Послушать" data-action="speak" data-text="${attr(w.example)}">◖</button><button class="btn btn-secondary btn-sm" data-action="word-detail" data-id="${w.id}">Детали →</button></div></footer></article>`).join('')}</div>${list.length>wordLimit?`<div class="button-row mt20"><button class="btn btn-secondary" data-action="show-more-words">Показать ещё 60 слов ↓</button></div>`:''}`:'<div class="empty"><h3>Здесь пока пусто</h3><p>Измени фильтр или поисковый запрос.</p></div>'}`}
function renderStats(){const attempts=allAttempts(),correct=allCorrect(),d=state.diagnostic;const activity=Array.from({length:7},(_,i)=>{const offset=i-6,key=todayKey(offset),a=state.activity[key]||{attempts:0};return {label:new Date(Date.now()+offset*DAY).toLocaleDateString('ru-RU',{weekday:'short'}),val:a.attempts}});const max=Math.max(1,...activity.map(x=>x.val));const trust=state.story.trust,supplies=state.story.supplies,intel=state.story.intel;let ending='Пока неизвестно';if(state.completed.length>=12)ending=trust>=intel&&trust>=supplies?'Люди объединяются вокруг нового города':intel>=supplies?'Вы строите город знаний и открытий':'Город выбирает устойчивость и запасы';return `<div class="eyebrow">TELEMETRY / ЛИЧНЫЙ ПРОГРЕСС</div><h1 class="headline">Не очки.<br>Реальные попытки.</h1><p class="lead">Смотри на то, что проверяется: сколько слов возвращено из памяти, сколько раз ты ошибался и сколько слов прошли повторения с интервалом.</p><div class="grid-3"><div class="stat-card"><span class="stat-label">Проверок за всё время</span><strong class="stat-value num">${attempts}</strong><span class="stat-meta">Самостоятельные ответы</span></div><div class="stat-card"><span class="stat-label">Верных попыток</span><strong class="stat-value num">${percent(correct,attempts)}%</strong><span class="stat-meta">${correct} из ${attempts}</span></div><div class="stat-card"><span class="stat-label">Глав пройдено</span><strong class="stat-value num">${state.completed.length}/12</strong><span class="stat-meta">Сюжетный прогресс</span></div></div><div class="two-col mt20"><section class="panel"><div class="smallcaps">АКТИВНОСТЬ / 7 ДНЕЙ</div><h2 class="mt14">Проверки по дням</h2><div class="chart">${activity.map(a=>`<div class="bar-col"><span class="bar-val">${a.val||''}</span><div class="bar" style="height:${Math.max(3,Math.round(a.val/max*115))}px"></div><span class="bar-label">${escapeHtml(a.label)}</span></div>`).join('')}</div><p class="bar-note">На графике — количество попыток, не время в приложении.</p></section><section class="panel"><div class="smallcaps">ОБЩАЯ КАРТИНА</div><h2 class="mt14">Память и привычка</h2><div class="list mt20"><div class="flex between"><span class="muted small">Начал изучать</span><strong>${knownCards()} / ${WORDS.length}</strong></div><div class="progress-line"><span style="width:${percent(knownCards(),WORDS.length)}%"></span></div><div class="flex between"><span class="muted small">Интервал ≥ 7 дней</span><strong>${durableCards()}</strong></div><div class="progress-line"><span style="width:${percent(durableCards(),Math.max(1,knownCards()))}%"></span></div><div class="flex between"><span class="muted small">Серия дней с занятиями</span><strong>${streak()}</strong></div><div class="line"></div><div class="smallcaps">ДИАГНОСТИКА</div>${d?`<p class="small muted">${d.score} / ${d.total} правильных, ${new Date(d.date).toLocaleDateString('ru-RU')}. Это тест узнавания 30 слов, а не оценка CEFR.</p>`:'<p class="small muted">Ещё не проходил стартовый тест.</p>'}<button class="btn btn-secondary btn-sm" data-action="start-diagnostic">${d?'Пройти ещё раз':'Пройти тест'} →</button></div></section></div><div class="section-heading"><div><h2>Последствия решений</h2><p>Это игровые показатели — не оценки знания языка.</p></div></div><div class="panel"><div class="stats-triplet"><div><strong>${trust}</strong><span>Доверие</span></div><div><strong>${supplies}</strong><span>Запасы</span></div><div><strong>${intel}</strong><span>Информация</span></div></div><p class="small muted mt20">${state.completed.length===12?`Финал: ${ending}.`:`Финал откроется после 12-й главы. Пройдено: ${state.completed.length} из 12.`}</p></div>`}

 <div class="button-row mt20"><button class="btn btn-secondary" data-action="route-page" data-value="${routePage-1}" ${routePage===0?'disabled':''}>← Назад</button><button class="btn btn-primary" data-action="route-page" data-value="${routePage+1}" ${start+12>=ROUTE_PACKS.length?'disabled':''}>Следующие наборы →</button></div>`;
}
function startRoute(n){const pack=ROUTE_PACKS[n-1];if(!pack)return;state.session={kind:'route',packId:n,phase:'study',idx:0,queue:[],results:{},feedback:null,options:null,hint:false};save();setPage('route-session')}
function routeNext(){const s=state.session;if(!s||s.kind!=='route'||s.phase!=='study')return;const pack=ROUTE_PACKS[s.packId-1];if(s.idx<pack.words.length-1)s.idx++;else{s.phase='quiz';s.idx=0;s.queue=[...randomize(pack.words.map(w=>({id:w.id,mode:'choice'}))),...randomize(pack.words.map(w=>({id:w.id,mode:'type'}))),...randomize(pack.words).slice(0,5).map(w=>({id:w.id,mode:'listen'}))];s.options=distractors(wordById[s.queue[0].id])}save();render()}
function renderRouteSession(){const s=state.session;if(!s||s.kind!=='route')return `<div class="empty"><h2>Словарный рейд не выбран</h2><button class="btn btn-primary" data-action="nav" data-page="route">Выбрать набор</button></div>`;const p=ROUTE_PACKS[s.packId-1];
 if(s.phase==='study'){const w=p.words[s.idx];return `<div class="lesson-frame"><div class="lesson-topline"><span class="smallcaps">VOCAB / РЕЙД ${p.id} · ЗНАКОМСТВО</span><span class="small muted num">${s.idx+1} / ${p.words.length}</span></div><div class="lesson-content"><div class="chip">${routePos[w.kind]||'Слово'}</div><div class="word-title">${escapeHtml(w.en)}</div><h2 style="color:var(--accent)">${escapeHtml(w.ru)}</h2><button class="audio-button" data-action="speak" data-text="${attr(w.en)}">◖)) Произнести слово</button><div class="line"></div><p class="small muted">Это одно распространённое значение. Слова с несколькими значениями будут изучаться глубже в контекстных заданиях. Попробуй произнести слово и вспомнить перевод, не глядя на него.</p></div><div class="button-row mt20"><button class="btn btn-primary" data-action="route-next">${s.idx===p.words.length-1?'Проверить 10 слов':'Следующее слово'} →</button><button class="btn btn-quiet" data-action="nav" data-page="route">К списку</button></div></div>`}
 if(s.phase==='complete'){const success=Object.values(s.results).reduce((n,x)=>n+x.correct,0);return `<div class="lesson-frame"><div class="eyebrow">РЕЙД ${p.id} / ТРЕНИРОВКА ЗАВЕРШЕНА</div><h1 class="headline">Первый контакт.<br>Теперь — повторения.</h1><p class="lead">${success} из 25 ответов засчитаны. Независимо от результата 10 слов перейдут в систему повторений. Это ещё не означает, что они выучены.</p><div class="results-grid"><div class="result-box"><strong>${success} / 25</strong><span>Верных ответов</span></div><div class="result-box"><strong>10</strong><span>Слов к повторению</span></div></div><button class="btn btn-primary" data-action="route-finish">Сохранить и продолжить →</button></div>`}
 const q=s.queue[s.idx],w=wordById[q.id],f=s.feedback,pct=percent(s.idx,s.queue.length);let content='';
 if(q.mode==='choice')content=`<div class="smallcaps">Переведи на русский</div><div class="word-title">${escapeHtml(w.en)}</div>${renderChoices(s.options||distractors(w),f,w.ru,'route-answer')}`;
 if(q.mode==='type')content=`<div class="smallcaps">Введи английское слово по памяти</div><h2 style="color:var(--accent)">${escapeHtml(w.ru)}</h2>${!f?`<form id="route-form" class="mt20"><input name="answer" class="answer-field" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Напиши по-английски…" required><div class="button-row mt14"><button type="submit" class="btn btn-primary">Проверить →</button></div></form>`:`<p>Твой ответ: <strong>${escapeHtml(f.answer)}</strong></p>`}`;
 if(q.mode==='listen')content=`<div class="smallcaps">Узнай слово на слух</div><p class="small muted">Воспроизводится отдельное слово, не предложение. После прослушивания выбери перевод.</p><button class="audio-button" data-action="speak" data-text="${attr(w.en)}">◖)) Слушать слово</button>${renderChoices(s.options||distractors(w),f,w.ru,'route-answer')}`;
 return `<div class="lesson-frame"><div class="lesson-head"><div class="label-row"><span class="smallcaps">РЕЙД ${p.id} / ${q.mode==='type'?'ВВОД ПО ПАМЯТИ':q.mode==='listen'?'АУДИРОВАНИЕ':'УЗНАВАНИЕ'}</span><span class="small muted num">${s.idx+1} / ${s.queue.length}</span></div><div class="progress-line"><span style="width:${pct}%"></span></div></div><div class="lesson-content">${content}${f?`<div class="feedback ${f.correct?'':'bad'}"><h3>${f.correct?'✓ Правильно':'↻ Ошибка — попробуешь ещё'}</h3><p><strong>${escapeHtml(w.en)}</strong> — ${escapeHtml(w.ru)}</p></div><div class="button-row mt20"><button class="btn btn-primary" data-action="route-advance">${s.idx===s.queue.length-1?'К результату':'Далее'} →</button></div>`:''}</div><p class="footnote">Один перевод — не всё значение слова. Даже верный ответ будет проверен повторно через интервалы.</p></div>`;
}
function answerRoute(answer){const s=state.session;if(!s||s.kind!=='route'||s.phase!=='quiz'||s.feedback)return;const q=s.queue[s.idx],w=wordById[q.id],correct=q.mode==='type'?norm(answer)===norm(w.en):answer===w.ru;s.feedback={answer:String(answer),correct};const record=s.results[w.id]||(s.results[w.id]={correct:0,failed:0,typeCorrect:false});if(correct)record.correct++;else record.failed++;if(q.mode==='type'&&correct)record.typeCorrect=true;activity(correct,'lesson');save();render()}
function routeAdvance(){const s=state.session;if(!s||s.kind!=='route'||!s.feedback)return;s.idx++;s.feedback=null;if(s.idx>=s.queue.length){s.phase='complete'}else{s.options=s.queue[s.idx].mode==='type'?null:distractors(wordById[s.queue[s.idx].id])}save();render()}
function routeFinish(){const s=state.session;if(!s||s.kind!=='route'||s.phase!=='complete')return;const p=ROUTE_PACKS[s.packId-1],now=Date.now();for(const w of p.words){const r=s.results[w.id]||{correct:0,failed:1,typeCorrect:false},old=state.cards[w.id];if(old){old.exposures=(old.exposures||0)+1;continue}const solid=r.typeCorrect&&r.failed===0;state.cards[w.id]={introducedAt:now,exposures:1,stage:0,interval:solid?1:10/1440,due:now+(solid?DAY:600000),reviews:0,failures:r.failed,successes:r.correct,lastReviewed:null}}
 if(!state.routesDone.includes(p.id))state.routesDone.push(p.id);state.session=null;save();setPage('route');toast(`Рейд ${p.id} завершён. Не пропускай повторения.`)}

function renderSettings(){return `<div class="eyebrow">CONTROL / PERSONAL</div><h1 class="headline">Твой темп.<br>Твои данные.</h1><p class="lead">Никакого аккаунта. Все результаты остаются в браузере этого устройства. Делай резервную копию перед очисткой браузера или переносом на другой телефон.</p><section class="panel"><div class="settings-row"><div><h3>Дневная цель</h3><p>Количество проверок, а не новых слов. Не ограничивает занятия.</p></div><select class="select" id="daily-goal" aria-label="Дневная цель">${[10,15,20,30,40].map(x=>`<option value="${x}" ${state.settings.dailyGoal===x?'selected':''}>${x} ответов</option>`).join('')}</select></div><div class="settings-row"><div><h3>Скорость английской речи</h3><p>Используется встроенная озвучка устройства. Качество голоса зависит от браузера и доступных голосов.</p></div><select class="select" id="voice-speed" aria-label="Скорость речи">${[['0.75','Медленно'],['0.9','Чуть медленнее'],['1','Обычно'],['1.1','Быстро']].map(([v,l])=>`<option value="${v}" ${Number(state.settings.speed)===Number(v)?'selected':''}>${l}</option>`).join('')}</select></div><div class="settings-row"><div><h3>Проверить звук</h3><p>Нажми и послушай короткое предложение на английском.</p></div><button class="btn btn-secondary btn-sm" data-action="speak" data-text="I understand more every day.">◖)) Проверить голос</button></div><div class="settings-row"><div><h3>Резервная копия</h3><p>Сохраняет главы, результаты, интервалы, настройки и сюжетные решения в JSON-файл.</p></div><div class="button-row"><button class="btn btn-secondary btn-sm" data-action="export">Экспорт ↓</button><button class="btn btn-secondary btn-sm" data-action="trigger-import">Импорт ↑</button><input type="file" id="import-file" accept=".json,application/json" class="hidden"></div></div><div class="settings-row"><div><h3>Удалить локальный прогресс</h3><p>Сбросит все данные этого сайта на текущем устройстве. Отменить без резервной копии нельзя.</p></div><button class="btn btn-danger btn-sm" data-action="reset-confirm">Сбросить</button></div></section><div class="notice mt20">База: 1000 уникальных английских слов (120 сюжетных и 880 словарных). Дополнительные слова сопровождаются кратким переводом и произношением, но не полноценными предложениями. Слова с разными значениями могут требовать отдельного изучения.</div><div class="notice mt20">Сайт работает без сервера и без регистрации. Обучение и словарь доступны офлайн после открытия файла. Озвучка работает только при поддержке встроенного речевого движка браузера; проверка произношения микрофоном пока не реализована.</div><p class="source-note">Методическая основа: активное воспроизведение и распределённая практика (<a href="https://www.nature.com/articles/s44159-022-00089-1" target="_blank" rel="noopener">Nature Reviews Psychology</a>), роль обратной связи (<a href="https://www.nature.com/articles/s41599-024-03983-6" target="_blank" rel="noopener">Humanities and Social Sciences Communications</a>). Справка об <a href="https://www.oxfordlearnersdictionaries.com/us/about/wordlists/oxford3000-5000" target="_blank" rel="noopener">Oxford 3000</a>. Эти исследования поддерживают отдельные методы, но не являются доказательством эффективности конкретно этой игры.</p>`}
function renderWordModal(id){const w=wordById[id];if(!w)return;modalWordId=id;$('#modal-layer').classList.remove('hidden');$('#modal-box').innerHTML=`<div class="label-row"><span class="smallcaps">СЛОВАРЬ / ${escapeHtml(w.level)}</span><button class="icon-btn" data-action="modal-close" aria-label="Закрыть">×</button></div><div class="word-title">${escapeHtml(w.en)}</div><h3 style="color:var(--accent)">${escapeHtml(w.ru)}</h3><div class="line"></div>${w.route?`<p class="translation">Словарная тренировка: пока без примера в предложении. Сначала научись самостоятельно вспоминать перевод и слово.</p>`:`<p class="example">${highlight(w.example,w.en)}</p><p class="translation">${escapeHtml(w.translation)}</p>`}<div class="button-row mt20"><button class="btn btn-secondary" data-action="speak" data-text="${attr(w.example)}">◖)) Слушать</button><button class="btn btn-secondary" data-action="favorite" data-id="${w.id}">${state.favorites.includes(w.id)?'★ Убрать из избранного':'☆ В избранное'}</button>${!state.cards[w.id]?`<button class="btn btn-primary" data-action="add-word" data-id="${w.id}">Добавить в повторение</button>`:''}</div><p class="footnote">${w.route?`Маршрут ${Math.ceil(Number(w.id.slice(1))/10)}. Отрабатывается одно основное значение. Учти: многие английские слова многозначны.`:`Глава ${w.chapter}. Вспоминай слово в разных контекстах, а не только его первый перевод.`}</p>`}
function closeModal(){$('#modal-layer').classList.add('hidden');modalWordId=null}
function exportProgress(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`echo-progress-${todayKey()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Резервная копия скачивается.')}
async function importProgress(file){if(!file)return;try{const data=JSON.parse(await file.text());if(data.version!==1||!data.cards||!data.settings||!Array.isArray(data.completed)||!data.activity)throw Error('Неверный формат файла');if(!window.confirm('Заменить текущий прогресс данными из файла?'))return;state={...initialState(),...data,settings:{...initialState().settings,...data.settings},story:{...initialState().story,...data.story},session:null};save();setPage('home');toast('Прогресс восстановлен из файла.')}catch(e){toast('Не получилось импортировать: неподходящий JSON.')}}
function showResetModal(){$('#modal-layer').classList.remove('hidden');$('#modal-box').innerHTML=`<div class="smallcaps">ОПАСНОЕ ДЕЙСТВИЕ</div><h2 class="mt14">Сбросить весь прогресс?</h2><p>Все изученные слова, решения по сюжету, повторы и результаты тестов будут удалены с этого устройства. Сначала можно экспортировать резервную копию.</p><div class="button-row mt20"><button class="btn btn-secondary" data-action="modal-close">Отмена</button><button class="btn btn-danger" data-action="reset">Да, удалить данные</button></div>`}
function finishSessionPrompt(){if(!state.session)return;const kind=state.session.kind;setPage(kind==='lesson'?'lesson':kind==='route'?'route-session':kind==='diagnostic'?'diagnostic':'review')}
function onAction(button){const a=button.dataset.action, id=button.dataset.id, value=button.dataset.value;if(a==='nav'){setPage(button.dataset.page);return}if(a==='start-next-route'){startRoute(nextRoutePack().id);return}if(a==='start-route'){startRoute(Number(id));return}if(a==='route-next'){routeNext();return}if(a==='route-answer'){answerRoute(value);return}if(a==='route-advance'){routeAdvance();return}if(a==='route-finish'){routeFinish();return}if(a==='route-page'){routePage=Number(value);setPage('route');return}if(a==='resume'){finishSessionPrompt();return}if(a==='start-chapter'){startChapter(id);return}if(a==='begin-study'){startStudy();return}if(a==='next-study'){nextStudy();return}if(a==='quiz-choice'){answerLesson(value);return}if(a==='next-quiz'){advanceQuiz();return}if(a==='listen-hint'){state.session.hint=true;save();render();return}if(a==='decision'){chooseDecision(value);return}if(a==='finish-chapter'){finishChapter();return}if(a==='start-diagnostic'){startDiagnostic();return}if(a==='diag-choice'){answerDiagnostic(value);return}if(a==='diag-unknown'){answerDiagnostic('');return}if(a==='next-diag'){nextDiagnostic();return}if(a==='start-review'){startReview(false);return}if(a==='start-sprint'){startReview(true);return}if(a==='grade'){gradeReview(value);return}if(a==='speak'){if(state.session&&['review','sprint'].includes(state.session.kind)&&!state.session.feedback){state.session.hint=true;save()}say(button.dataset.text);return}if(a==='word-filter'){wordFilter=button.dataset.filter;wordLimit=60;render();return}if(a==='show-more-words'){wordLimit+=60;$('#lexicon-results').innerHTML=renderLexiconResults();return}if(a==='favorite'){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();if(modalWordId)renderWordModal(modalWordId);else render();return}if(a==='word-detail'){renderWordModal(id);return}if(a==='modal-close'){closeModal();return}if(a==='add-word'){if(!state.cards[id]){state.cards[id]={introducedAt:Date.now(),exposures:1,stage:0,interval:0,due:Date.now(),reviews:0,failures:0,successes:0,lastReviewed:null};save();toast('Добавлено. Первое повторение доступно сейчас.')}renderWordModal(id);return}if(a==='export'){exportProgress();return}if(a==='trigger-import'){$('#import-file').click();return}if(a==='reset-confirm'){showResetModal();return}if(a==='reset'){state=initialState();save();closeModal();setPage('home');toast('Локальный прогресс очищен.');return}}
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(button){event.preventDefault();onAction(button)}else if(event.target.id==='modal-layer')closeModal()});
document.addEventListener('submit',event=>{if(event.target.id==='route-form'){event.preventDefault();answerRoute(event.target.elements.answer.value)}if(event.target.id==='quiz-form'){event.preventDefault();answerLesson(event.target.elements.answer.value)}if(event.target.id==='review-form'){event.preventDefault();answerReview(event.target.elements.answer.value)}});
document.addEventListener('input',event=>{if(event.target.id==='word-search'){wordSearch=event.target.value;wordLimit=60;$('#lexicon-results').innerHTML=renderLexiconResults()}});
document.addEventListener('change',event=>{if(event.target.id==='daily-goal'){state.settings.dailyGoal=Number(event.target.value);save();toast('Дневная цель сохранена.')}if(event.target.id==='voice-speed'){state.settings.speed=Number(event.target.value);save();toast('Скорость речи изменена.')}if(event.target.id==='import-file'){importProgress(event.target.files?.[0]);event.target.value=''}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('#modal-layer').classList.contains('hidden'))closeModal();if(/^[1-4]$/.test(event.key)&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){const s=state.session;if(s&&s.kind==='lesson'&&s.phase==='quiz'&&s.queue[s.idx].mode!=='type'&&!s.feedback){const value=$$('.choice')[Number(event.key)-1]?.dataset.value;if(value)answerLesson(value)}if(s&&s.kind==='diagnostic'&&!s.feedback){const value=$$('.choice')[Number(event.key)-1]?.dataset.value;if(value)answerDiagnostic(value)}}});
function $$(sel){return document.querySelectorAll(sel)}
render();
</script>
</body>
</html>
